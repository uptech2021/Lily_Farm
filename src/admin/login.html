<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Rishi's Lily Farm</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="brand-title">Rishi's Lily Farm</h1>
                <p class="brand-subtitle">Admin Dashboard</p>
            </div>
            
            <form class="login-form" data-validate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="admin@lilyfarm.com" value="admin@lilyfarm.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:12px;">
                    <label class="switch" style="margin-bottom:0;">
                        <input type="checkbox" name="remember" id="remember">
                        <span class="slider"></span>
                    </label>
                    <span style="font-size:0.85rem;color:var(--dark-text);">Remember me</span>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>
                <div style="text-align:center;margin-top:20px;">
                    <a href="#" style="color:var(--primary-green);text-decoration:none;font-size:0.85rem;">Forgot your password?</a>
                </div>
            </form>
        </div>
        <div class="login-info">
            <div class="info-card" style="max-width:360px;">
                <h3 style="margin-bottom:12px;">Welcome Back!</h3>
                <p style="margin-bottom:24px;">Access your admin dashboard to manage products, orders, and more.</p>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem;"><i class="fas fa-box" style="color:var(--primary-green);width:20px;"></i> Manage Products</div>
                    <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem;"><i class="fas fa-truck" style="color:var(--primary-green);width:20px;"></i> Process Orders</div>
                    <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem;"><i class="fas fa-star" style="color:var(--primary-green);width:20px;"></i> Review Feedback</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script src="../js/forms.js"></script>
</body>
</html>
