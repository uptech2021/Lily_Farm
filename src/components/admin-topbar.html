<div class="admin-topbar">
  <button class="btn btn-secondary d-md-none" data-sidebar-toggle>
    <i class="fas fa-bars"></i>
  </button>
  <div class="topbar-search">
    <input type="search" class="search-input" placeholder="Search products, orders, customers..." data-table-search="main-table">
  </div>
  <div class="topbar-actions">
    <button class="notification-btn" data-modal-target="notifications-modal">
      <i class="fas fa-bell"></i>
      <span class="notification-badge">3</span>
    </button>
    <div class="profile-menu">
      <button class="profile-btn" data-dropdown-toggle>
        <div class="avatar">KN</div>
        <span class="d-none d-md-inline">Kyle Nagee</span>
        <i class="fas fa-chevron-down" style="font-size:0.75rem;margin-left:2px;"></i>
      </button>
      <div class="dropdown-menu">
        <a href="#" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
        <div class="dropdown-divider"></div>
        <a href="login.html" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
      </div>
    </div>
  </div>
</div>

<div class="sidebar-overlay d-md-none"></div>

<div id="notifications-modal" class="modal-backdrop d-none">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Notifications</h3>
      <button class="modal-close" type="button"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="notification-list">
        <div class="notification-item" style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">
          <i class="fas fa-check-circle" style="color:var(--ok);font-size:1.2rem;margin-top:2px;"></i>
          <div>
            <div style="font-weight:600;">New Order Received</div>
            <div style="color:var(--light-text);font-size:0.85rem;">Order #1234 from John Doe</div>
            <div style="color:var(--light-text);font-size:0.75rem;">2 minutes ago</div>
          </div>
        </div>
        <div class="notification-item" style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">
          <i class="fas fa-exclamation-triangle" style="color:var(--warn);font-size:1.2rem;margin-top:2px;"></i>
          <div>
            <div style="font-weight:600;">Low Stock Alert</div>
            <div style="color:var(--light-text);font-size:0.85rem;">Water Lily 'Pink Princess' is running low</div>
            <div style="color:var(--light-text);font-size:0.75rem;">1 hour ago</div>
          </div>
        </div>
        <div class="notification-item" style="display:flex;gap:12px;padding:12px 0;">
          <i class="fas fa-star" style="color:var(--accent-gold);font-size:1.2rem;margin-top:2px;"></i>
          <div>
            <div style="font-weight:600;">New Review</div>
            <div style="color:var(--light-text);font-size:0.85rem;">5-star review for Lotus 'Sacred Pink'</div>
            <div style="color:var(--light-text);font-size:0.75rem;">3 hours ago</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
