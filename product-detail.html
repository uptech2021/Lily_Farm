<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail | Rishi's Lily Farm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="src/js/firebase-config.js"></script>
  <script src="src/js/firebase.js"></script>
  <script src="src/js/products.js"></script>
  <script src="src/js/promotions.js"></script>
  <script src="src/js/footer.js"></script>
  <style>
    body { background-color: #f5f5f5; }
    .detail-search-container { max-width: 450px; margin: 20px auto; padding: 0 16px; }
    .page-banner { background: linear-gradient(135deg, var(--primary-green), var(--light-green)); color: white; text-align: center; padding: 2.5rem 1rem; margin-bottom: 2rem; position: relative; }
    .page-banner h1 { font-size: 2rem; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
    .page-banner .back-link { position: absolute; left: 1.5rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.95rem; }
    .page-banner .back-link:hover { color: white; }
    .product-detail { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .product-detail-layout { display: flex; gap: 40px; align-items: flex-start; background: white; border-radius: 12px; box-shadow: var(--shadow); padding: 40px; }
    .product-image-section { flex: 0 0 400px; }
    .product-image-section img { width: 100%; height: 400px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .product-image-section .no-img { width: 100%; height: 400px; border-radius: 10px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #ccc; }
    .product-info-section { flex: 1; min-width: 0; }
    .product-info-section h1 { font-size: 2rem; font-weight: 700; color: var(--dark-text); margin-bottom: 12px; }
    .category-badge { display: inline-block; background: var(--light-green); color: white; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
    .price-display { font-size: 1.6rem; font-weight: 700; color: var(--primary-green); margin-bottom: 24px; padding: 10px 0; border-top: 2px solid #e8f5e9; border-bottom: 2px solid #e8f5e9; }
    .info-card { background: var(--light-bg); border-left: 4px solid var(--primary-green); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
    .info-card .info-title { font-weight: 700; color: var(--dark-text); margin-bottom: 8px; font-size: 1.05rem; }
    .info-card .info-title i { color: var(--primary-green); width: 22px; margin-right: 6px; }
    .info-card p { margin: 0; color: #555; line-height: 1.7; font-size: 1rem; }
    .detail-actions { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .btn-add-cart { background: linear-gradient(135deg, var(--primary-green), var(--light-green)); color: white; border: none; border-radius: 8px; padding: 14px 36px; font-size: 1.05rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
    .btn-add-cart:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46, 125, 50, 0.35); }
    .btn-add-cart:disabled { opacity: 0.7; cursor: default; transform: none; }
    .btn-add-cart .cart-count { background: var(--accent-gold); color: var(--dark-text); font-size: 0.75rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; position: absolute; top: -6px; right: -6px; min-width: 18px; text-align: center; }
    .toast-notification { position: fixed; bottom: 24px; right: 24px; background: var(--primary-green); color: white; padding: 14px 24px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.2); z-index: 999; transform: translateY(80px); opacity: 0; transition: transform 0.35s ease, opacity 0.35s ease; pointer-events: none; display: flex; align-items: center; gap: 10px; }
    .toast-notification.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .btn-back { background: transparent; color: var(--light-text); border: 2px solid #ddd; border-radius: 8px; padding: 14px 28px; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .btn-back:hover { border-color: var(--primary-green); color: var(--primary-green); }
    .stock-badge-detail { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; margin-left: 8px; }
    .stock-badge-detail.in-stock { background: #e8f5e9; color: #2e7d32; }
    .stock-badge-detail.out-of-stock { background: #fbe9e7; color: #c62828; }
    .featured-badge-detail { color: var(--accent-gold); margin-left: 8px; }
    @media (max-width: 900px) { .product-detail-layout { flex-direction: column; padding: 28px; } .product-image-section { flex: none; width: 100%; max-width: 400px; margin: 0 auto; } .product-image-section img { height: auto; aspect-ratio: 1; } .page-banner h1 { font-size: 1.5rem; } .page-banner .back-link { position: static; display: block; transform: none; margin-bottom: 12px; } }
    @media (max-width: 480px) { .product-detail-layout { padding: 20px; } .product-info-section h1 { font-size: 1.4rem; } .price-display { font-size: 1.3rem; } .detail-actions { flex-direction: column; } .btn-add-cart, .btn-back { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <div class="detail-search-container">
    <div class="input-group">
      <input type="text" id="detailSearch" class="form-control" placeholder="Search products...">
      <button class="btn btn-success btn-sm" id="detailSearchBtn">Search</button>
    </div>
  </div>

  <div class="page-banner">
    <a href="products.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Products</a>
    <h1 id="productHeader"></h1>
  </div>

  <div class="product-detail">
    <div class="product-detail-layout" id="productContent" style="display:none;">
      <div class="product-image-section">
        <div id="productImageWrapper"><img id="productImage" src="" alt=""></div>
      </div>
      <div class="product-info-section">
        <div>
          <span class="category-badge" id="productCategory"></span>
          <span class="stock-badge-detail" id="stockBadge"></span>
          <span class="featured-badge-detail" id="featuredBadge"></span>
        </div>
        <h1 id="productName"></h1>
        <div class="price-display" id="productPrice"></div>
        <div class="info-card">
          <div class="info-title"><i class="fas fa-leaf"></i> Description</div>
          <p id="productDescription"></p>
        </div>
        <div class="info-card" id="fertilizerCard">
          <div class="info-title"><i class="fas fa-flask"></i> Fertilizer Information</div>
          <p id="productFertilizer"></p>
        </div>
        <div class="detail-actions">
          <button class="btn-add-cart" id="addToCartBtn"><i class="fas fa-cart-plus"></i> Add to Cart <span class="cart-count" id="cartCount">0</span></button>
          <a href="products.html" class="btn-back"><i class="fas fa-arrow-left"></i> All Products</a>
        </div>
      </div>
    </div>

    <div class="toast-notification" id="cartToast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Added to cart!</span></div>

    <div id="productLoading" style="text-align:center;padding:60px 20px;">
      <i class="fas fa-spinner fa-pulse" style="font-size:2rem;color:var(--primary-green);"></i>
      <p style="margin-top:12px;color:var(--light-text);">Loading product...</p>
    </div>

    <div id="productNotFound" style="display:none;text-align:center;padding:60px 20px;">
      <i class="fas fa-seedling" style="font-size:3rem;color:var(--light-green);"></i>
      <h2 style="margin-top:16px;color:var(--dark-text);">Product Not Found</h2>
      <p style="color:var(--light-text);">Sorry, we couldn't find this product.</p>
      <a href="products.html" class="btn-back" style="display:inline-flex;margin-top:16px;"><i class="fas fa-arrow-left"></i> Browse Products</a>
    </div>
  </div>

  <footer><div id="footer"></div></footer>

  <script>
  function showToast(msg) {
    document.getElementById("toastMsg").textContent = msg;
    document.getElementById("cartToast").classList.add("show");
    setTimeout(() => document.getElementById("cartToast").classList.remove("show"), 2500);
  }

  async function updateCartCount() {
    const items = await fbGetCart();
    document.getElementById("cartCount").textContent = items.reduce((s, i) => s + i.qty, 0);
  }

  function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderProduct(product) {
    if (!product) {
      document.getElementById("productLoading").style.display = "none";
      document.getElementById("productNotFound").style.display = "block";
      return;
    }

    document.title = product.name + " | Rishi's Lily Farm";
    document.getElementById("productHeader").textContent = product.name;
    document.getElementById("productName").textContent = product.name;
    document.getElementById("productDescription").textContent = product.description;
    document.getElementById("productCategory").textContent = product.category;

    var priceEl = document.getElementById("productPrice");
    var price = Number(product.price);
    var promo = getDiscountedPrice(price, product.category);
    if (promo) {
      priceEl.innerHTML = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><span style="text-decoration:line-through;color:#999;font-size:1.2rem;">TTD $' + price.toFixed(2) + '</span><span style="font-weight:700;color:#c62828;font-size:1.8rem;">TTD $' + promo.discounted.toFixed(2) + '</span><span style="background:#c62828;color:#fff;padding:4px 14px;border-radius:20px;font-size:0.85rem;font-weight:700;">' + promo.discount + '% OFF</span></div>';
    } else {
      priceEl.innerHTML = 'TTD $' + price.toFixed(2);
    }

    var promos = getPromotionsForCategory(product.category);
    var bannerHtml = '';
    if (promos.active.length > 0) {
      var pa = promos.active[0];
      bannerHtml = '<div style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:1px solid #a5d6a7;border-radius:10px;padding:14px 20px;margin-bottom:18px;display:flex;align-items:center;gap:12px;"><i class="fas fa-bolt" style="color:#2e7d32;font-size:1.3rem;"></i><div><strong style="color:#1b5e20;">Sale on ' + esc(pa.categories && pa.categories.length ? pa.categories.join(' & ') : 'All Categories') + '</strong><span style="color:#2e7d32;font-size:0.85rem;display:block;">' + Number(pa.discount) + '% off &mdash; ends ' + new Date(pa.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span></div></div>';
    } else if (promos.upcoming.length > 0) {
      var pu = promos.upcoming[0];
      bannerHtml = '<div style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:1px solid #a5d6a7;border-radius:10px;padding:14px 20px;margin-bottom:18px;display:flex;align-items:center;gap:12px;"><i class="fas fa-clock" style="color:#2e7d32;font-size:1.3rem;"></i><div><strong style="color:#1b5e20;">Coming Soon: Sale on ' + esc(pu.categories && pu.categories.length ? pu.categories.join(' & ') : 'All Categories') + '</strong><span style="color:#2e7d32;font-size:0.85rem;display:block;">' + Number(pu.discount) + '% off &mdash; starts ' + new Date(pu.startDate).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span></div></div>';
    }
    if (bannerHtml) {
      priceEl.insertAdjacentHTML('beforebegin', bannerHtml);
    }

    const imgEl = document.getElementById("productImage");
    if (product.image) {
      imgEl.src = product.image;
      imgEl.alt = product.name;
      document.getElementById("productImageWrapper").innerHTML = '<img id="productImage" src="' + esc(product.image) + '" alt="' + esc(product.name) + '" onerror="this.outerHTML=\'<div class=\\\'no-img\\\'><i class=\\\'fas fa-image\\\'></i></div>\'">';
    } else {
      document.getElementById("productImageWrapper").innerHTML = '<div class="no-img"><i class="fas fa-image"></i></div>';
    }

    const fertilizerEl = document.getElementById("productFertilizer");
    const fertilizerCard = document.getElementById("fertilizerCard");
    if (product.fertilizerInfo) {
      fertilizerEl.textContent = product.fertilizerInfo;
      fertilizerCard.style.display = "block";
    } else {
      fertilizerCard.style.display = "none";
    }

    const stockBadge = document.getElementById("stockBadge");
    if (product.inStock !== false) {
      stockBadge.textContent = "In Stock";
      stockBadge.className = "stock-badge-detail in-stock";
      document.getElementById("addToCartBtn").disabled = false;
    } else {
      stockBadge.textContent = "Out of Stock";
      stockBadge.className = "stock-badge-detail out-of-stock";
      document.getElementById("addToCartBtn").disabled = true;
    }

    const featuredBadge = document.getElementById("featuredBadge");
    featuredBadge.innerHTML = product.featured ? '<i class="fas fa-star" title="Featured Product"></i>' : '';

    document.getElementById("productContent").style.display = "flex";
    document.getElementById("productLoading").style.display = "none";

    document.getElementById("addToCartBtn").onclick = async function() {
      if (this.disabled) return;
      this.disabled = true;
      await fbAddToCart(product.slug);
      await updateCartCount();
      showToast(product.name + " added to cart!");
      this.disabled = false;
    };

    updateCartCount();
  }

  function init() {
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    if (productId && window.products[productId]) {
      renderProduct(window.products[productId]);
    } else if (productId) {
      document.getElementById("productLoading").style.display = "none";
      document.getElementById("productNotFound").style.display = "block";
    } else {
      document.getElementById("productLoading").style.display = "none";
      document.getElementById("productNotFound").style.display = "block";
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (window.PRODUCTS_LOADED) { init(); } else { document.addEventListener('productsLoaded', init); }
  });

  document.getElementById("detailSearchBtn").addEventListener("click", function() {
    const q = document.getElementById("detailSearch").value.toLowerCase().trim();
    for (const key in window.products) {
      if (window.products[key].name.toLowerCase() === q) {
        window.location.href = "product-detail.html?id=" + key; return;
      }
    }
    alert("No matching product found.");
  });

  </script>
</body>
</html>
