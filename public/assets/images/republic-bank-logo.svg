<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Teal/Turquoise background -->
  <rect width="400" height="400" fill="#17A2B8"/>
  
  <!-- White rotated diamond/square in center -->
  <g transform="translate(200, 180)">
    <!-- Outer diamond -->
    <rect x="-55" y="-55" width="110" height="110" fill="none" stroke="white" stroke-width="4" transform="rotate(45)"/>
    <!-- Inner gap (negative space) -->
    <rect x="-35" y="-35" width="70" height="70" fill="#17A2B8" transform="rotate(45)"/>
    <!-- Small rectangle on bottom right -->
    <rect x="30" y="30" width="50" height="25" fill="white" transform="rotate(45)"/>
    <!-- Small rectangle on top left -->
    <rect x="-60" y="-60" width="50" height="25" fill="white" transform="rotate(45)"/>
  </g>
</svg>
