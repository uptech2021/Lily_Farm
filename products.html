<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rishi's Lily Farm - Product Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src/css/styles.css">
  <link rel="stylesheet" href="src/css/products.css">
  <link rel="stylesheet" href="src/css/whatsapp-button.css">
  <style>
    .stock-badge { font-size:0.75rem; padding:2px 10px; border-radius:12px; font-weight:600; display:inline-block; }
    .stock-badge.in-stock { background:#e8f5e9; color:#2e7d32; }
    .stock-badge.out-of-stock { background:#fbe9e7; color:#c62828; }
    .featured-tag { color:var(--accent-gold); font-size:0.75rem; margin-left:4px; }
    .category-section { margin-bottom: 40px; }
    .category-section h2 { margin-bottom: 20px; display:flex; align-items:center; justify-content:center; gap:10px; }
    .fertilizer-info { font-size:0.85rem; color:var(--light-text); margin-top:4px; }
    .product-price { font-weight:700; color:var(--primary-green); font-size:1.1rem; }
    #productsContainer:empty { display: none !important; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="products-header">
    <h1>Welcome to Rishi's Lily Farm</h1>
    <p>Discover the Beauty of Tropical Water Lilies and Exotic Plants</p>
  </div>

  <div class="search-container">
    <div class="d-flex justify-content-center">
      <div class="input-group" style="max-width: 400px;">
        <input type="text" id="productSearch" class="form-control" placeholder="Search products...">
        <button class="btn btn-success btn-sm" id="searchBtn">Search</button>
      </div>
    </div>
    <p id="noResults" class="text-center mt-3 text-danger" style="display:none;">No results found</p>
  </div>

  <div id="productsContainer"></div>

  <footer>
    <div id="footer"></div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="src/js/firebase-config.js"></script>
  <script src="src/js/firebase.js"></script>
  <script src="src/js/utils.js"></script>
  <script src="src/js/products.js"></script>
  <script src="src/js/promotions.js"></script>
  <script src="src/js/footer.js?v=20260816d"></script>

  <script>
  function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function promoCatLabel(type) {
    var cats = getCoveredCategories(type);
    if (cats === 'all') return 'All Categories';
    if (!cats || cats.length === 0) return '';
    var labels = cats.map(function(c) { return c + 's'; });
    if (labels.length === 1) return labels[0];
    return labels.slice(0, -1).join(', ') + ' & ' + labels[labels.length - 1];
  }

  function priceHtml(product) {
    var price = Number(product.price);
    var sale = getDiscountedPrice(price, product.category);
    if (sale) {
      return '<div style="display:flex;align-items:center;justify-content:center;gap:6px;"><span style="text-decoration:line-through;color:#999;font-size:0.95rem;">TTD $' + price.toFixed(2) + '</span><span style="font-weight:700;color:#c62828;font-size:1.15rem;">TTD $' + sale.discounted.toFixed(2) + '</span></div>';
    }
    return '<div class="product-price">TTD $' + price.toFixed(2) + '</div>';
  }

  function getProductImage(product) {
    if (!product) return 'img/lily%20flowers.jpg';
    if (product.image) return product.image;

    const imageMap = {
      'amaryllis': 'img/amaryllis.jpg',
      'red-amaryllis': 'img/red-amaryllis.jpg',
      'light-yellow-day-bloomer': 'img/light-yellow-day-bloomer.jpg',
      'dark-yellow-day-bloomer': 'img/dark-yellow-day-bloomer.jpg',
      'purple-blue-day-bloomer': 'img/purple-blue-day-bloomer.jpg',
      'light-purple-day-bloomer': 'img/light-purple-day-bloomer.jpg',
      'dark-purple-day-bloomer': 'img/dark-purple-day-bloomer.jpg',
      'white-night-bloomer': 'img/white-night-bloomer.jpg',
      'light-pink-night-bloomer': 'img/light-pink-night-bloomer.jpg',
      'dark-pink-night-bloomer': 'img/dark-pink-night-bloomer.jpg',
      'pink-indian-lotus': 'img/pink-indian-lotus.jpg',
      'golden-champaca': 'img/golden-champaca.jpg',
      'rangoon-creeper': 'img/rangoon-creeper.jpg',
      'parrots-beak-heliconia': 'img/parrot\'s-beak-heliconia.jpg',
      'variegated-purple-day-bloomer': 'img/variegated-purple-day-bloomer.jpg',
      'white-purple-day-bloomer': 'img/white-purple-day-bloomer.jpg'
    };

    const slug = (product.slug || product.id || '').toLowerCase();
    return imageMap[slug] || 'img/lily%20flowers.jpg';
  }

  function renderPromoBanner() {
    var active = getActivePromotions();
    var upcoming = getUpcomingPromotions();
    if (active.length > 0) {
      var p = active[0];
      var catLabel = promoCatLabel('active');
      var title = catLabel ? 'Sale on ' + catLabel : esc(p.bannerText || 'Sale is live!');
      return '<div style="background:linear-gradient(135deg,#1b5e20,#2e7d32);border-radius:12px;padding:18px 24px;margin-bottom:24px;display:flex;align-items:center;gap:14px;color:#fff;">' +
        '<i class="fas fa-bolt" style="font-size:1.5rem;"></i>' +
        '<div style="flex:1;"><strong style="font-size:1.1rem;">' + title + '</strong>' +
        '<span style="opacity:0.9;font-size:0.85rem;display:block;">' + Number(p.discount) + '% off &mdash; ' + new Date(p.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span></div>' +
        '<span style="background:rgba(255,255,255,0.2);padding:6px 18px;border-radius:20px;font-weight:700;font-size:1rem;">' + Number(p.discount) + '% OFF</span></div>';
    }
    if (upcoming.length > 0) {
      var u = upcoming[0];
      var catLabel = promoCatLabel('upcoming');
      var title = catLabel ? 'Sale on ' + catLabel : esc(u.bannerText || 'Sale incoming');
      return '<div style="background:linear-gradient(135deg,#2e7d32,#4caf50);border-radius:12px;padding:18px 24px;margin-bottom:24px;display:flex;align-items:center;gap:14px;color:#fff;">' +
        '<i class="fas fa-clock" style="font-size:1.5rem;"></i>' +
        '<div style="flex:1;"><strong style="font-size:1.1rem;">Coming Soon: ' + title + '</strong>' +
        '<span style="opacity:0.9;font-size:0.85rem;display:block;">' + Number(u.discount) + '% off &mdash; starts ' + new Date(u.startDate).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span></div>' +
        '<span style="background:rgba(255,255,255,0.2);padding:6px 18px;border-radius:20px;font-weight:700;font-size:1rem;">' + Number(u.discount) + '% OFF</span></div>';
    }
    return '';
  }

  function renderEmptyState() {
    const container = document.getElementById('productsContainer');
    if (!container) return;
    container.innerHTML = '';
    container.style.display = 'none';
    container.hidden = true;
  }

  function renderProducts() {
    const container = document.getElementById('productsContainer');
    if (!container) return;
    if (!window.PRODUCTS_LOADED || !window.products || Object.keys(window.products).length === 0) {
      renderEmptyState();
      return;
    }
    container.style.display = 'block';
    container.hidden = false;
    var promoBanner = renderPromoBanner();
    const cats = ['Lily', 'Exotic', 'Fertilizer'];
    const catIcons = { Lily: 'fas fa-water', Exotic: 'fas fa-seedling', Fertilizer: 'fas fa-flask' };
    let html = '';
    if (promoBanner) html += promoBanner;

    cats.forEach(cat => {
      const items = getProductsByCategory(cat);
      if (items.length === 0) return;
      html += '<div class="category-section"><h2><i class="' + (catIcons[cat] || 'fas fa-leaf') + '" style="color:var(--primary-green);"></i> ' + cat + 's</h2>';
      html += '<section class="gallery">';
      items.forEach(p => {
        const stockHtml = p.inStock !== false
          ? '<span class="stock-badge in-stock"><i class="fas fa-check-circle"></i> In Stock</span>'
          : '<span class="stock-badge out-of-stock"><i class="fas fa-times-circle"></i> Out of Stock</span>';
        const featuredHtml = p.featured ? '<span class="featured-tag"><i class="fas fa-star" title="Featured"></i></span>' : '';
        const imgPath = getProductImage(p);
        const descriptionHtml = p.description ? '<p style="font-size:0.85rem;color:var(--light-text);margin:8px 0;line-height:1.4;">' + esc(p.description) + '</p>' : '';
        const addToCartBtn = p.inStock !== false 
          ? '<button class="add-to-cart-btn" data-product-id="' + esc(p.slug) + '" data-product-name="' + esc(p.name) + '" style="width:100%;margin-top:10px;padding:8px 16px;background:#2e7d32;color:white;border:none;border-radius:4px;cursor:pointer;font-weight:600;font-size:0.9rem;transition:background 0.3s ease;" onmouseover="this.style.background=\'#1b5e20\';" onmouseout="this.style.background=\'#2e7d32\';">Add to Cart</button>'
          : '<button style="width:100%;margin-top:10px;padding:8px 16px;background:#ccc;color:#666;border:none;border-radius:4px;cursor:not-allowed;font-weight:600;font-size:0.9rem;" disabled>Out of Stock</button>';
        html += '<figure><a href="product-detail.html?id=' + esc(p.slug) + '"><img src="' + esc(imgPath) + '" alt="' + esc(p.name) + '" onerror="this.src=\'img/lily%20flowers.jpg\';this.alt=\'No image\';this.style.objectFit=\'cover\';this.style.padding=\'0\';this.style.background=\'#f0f0f0\';"></a><figcaption>' + esc(p.name) + ' ' + featuredHtml + priceHtml(p) + descriptionHtml + '<div style="margin-top:4px;">' + stockHtml + '</div>' + addToCartBtn + '</figcaption></figure>';
      });
      html += '</section></div>';
    });

    container.innerHTML = html || '<p class="text-center" style="padding:60px 20px;color:var(--light-text);">No products available yet.</p>';
  }

  document.addEventListener('DOMContentLoaded', function() {
    function render() {
      if (window.PRODUCTS_LOADED) {
        renderProducts();
        attachAddToCartListeners();
      } else {
        renderEmptyState();
      }
    }
    
    function attachAddToCartListeners() {
      const buttons = document.querySelectorAll('.add-to-cart-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const productId = this.getAttribute('data-product-id');
          const productName = this.getAttribute('data-product-name');
          addToCart(productId, productName);
        });
      });
    }
    
    function addToCart(productId, productName) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existingItem = cart.find(item => item.id === productId);
      
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ id: productId, name: productName, quantity: 1 });
      }
      
      localStorage.setItem('cart', JSON.stringify(cart));
      window.location.href = 'cart.html';
    }
    
    render();
    document.addEventListener('productsLoaded', function() {
      renderProducts();
      attachAddToCartListeners();
    });
    document.addEventListener('promotionsLoaded', function() {
      renderProducts();
      attachAddToCartListeners();
    });
    document.getElementById('searchBtn').addEventListener('click', function() {
      var val = document.getElementById('productSearch').value.toLowerCase().trim();
      var found = false;
      for (var key in window.products) {
        if (window.products[key].name.toLowerCase() === val) {
          window.location.href = 'product-detail.html?id=' + key;
          found = true; break;
        }
      }
      if (!found) {
        document.getElementById('noResults').style.display = 'block';
        setTimeout(function() { document.getElementById('noResults').style.display = 'none'; }, 3000);
      }
    });
  });

  fetch("src/components/navbar.html").then(r => r.text()).then(html => {
    document.getElementById("navbar").innerHTML = html;
    updateCartBadge();
    initializeMobileMenu();
    const page = "products.html";
    document.querySelectorAll("#navbar a").forEach(a => { if (a.getAttribute("href") === page) a.classList.add("active"); });
  });
  </script>
  <script src="src/js/whatsapp-button.js"></script>
</body>
</html>
